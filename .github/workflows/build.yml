name: 🚀 OpenWrt Builder

# ================================================================================
# Trigger Configuration
# ================================================================================
on:
  repository_dispatch:
    types: [Source-Code-Update]
  workflow_dispatch:
    inputs:
      build_type:
        description: '🛠️ Build Type'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - debug
        - minimal
      upload_firmware:
        description: '📤 Upload Firmware'
        required: false
        default: true
        type: boolean
      upload_release:
        description: '🎯 Create Release'
        required: false
        default: true
        type: boolean

# ================================================================================
# Jobs Configuration
# ================================================================================
jobs:
  build:
    name: 🏗️ Build OpenWrt Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    
    steps:
      # ============================================================================
      # Preparation Phase
      # ============================================================================
      - name: 🚀 Initialize Build Environment
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: 🛠️ Load Configuration & Setup Environment
        run: |
          echo "::group::🔧 Configuration Loading"
          
          # Load configuration from config.env
          if [ -f ".github/workflows/config.env" ]; then
            echo "📋 Loading configuration from config.env..."
            # Source the config file and export all variables
            while IFS='=' read -r key value; do
              # Skip comments and empty lines
              [[ $key =~ ^[[:space:]]*# ]] && continue
              [[ -z $key ]] && continue
              # Remove quotes from value and export
              value=$(echo "$value" | sed 's/^"\(.*\)"$/\1/')
              # Skip empty values
              [[ -z $value ]] && continue
              export "$key=$value"
              echo "$key=$value" >> $GITHUB_ENV
            done < .github/workflows/config.env
            echo "✅ Configuration loaded successfully"
          else
            echo "❌ Configuration file not found!"
            exit 1
          fi

          # Set dynamic environment variables
          echo "BUILD_TYPE=${{ github.event_name == 'workflow_dispatch' && 'manual' || 'auto' }}" >> $GITHUB_ENV
          
          # Override upload settings if provided via inputs
          if [ "${{ github.event.inputs.upload_firmware }}" != "" ]; then
            echo "UPLOAD_FIRMWARE=${{ github.event.inputs.upload_firmware }}" >> $GITHUB_ENV
          fi
          if [ "${{ github.event.inputs.upload_release }}" != "" ]; then
            echo "UPLOAD_RELEASE=${{ github.event.inputs.upload_release }}" >> $GITHUB_ENV
          fi
          
          echo "::endgroup::"

      - name: 📁 Setup Configuration Branch
        run: |
          echo "::group::🔧 Configuration Branch Setup"
          
          # Setup Git configuration
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          
          # Clean up any conflicting files
          echo "🧹 Cleaning up conflicting files..."
          rm -f op_updates_*.txt qmodem_updates_*.txt *_last_commit.txt 2>/dev/null || true
          
          # Stash any local changes
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "💾 Stashing local changes..."
            git stash push -m "Auto-stash before config branch operations"
          fi
          
          # Check out configuration branch to read existing records
          if git rev-parse --verify origin/$CONFIG_BRANCH >/dev/null 2>&1; then
            echo "📂 Config branch exists, checking out..."
            git fetch origin $CONFIG_BRANCH
            git checkout $CONFIG_BRANCH
            
            # Copy config files to main branch working directory for use during build
            git checkout ${{ github.ref_name }}
            git show $CONFIG_BRANCH:op_updates_latest.txt > op_updates_latest.txt 2>/dev/null || true
            git show $CONFIG_BRANCH:qmodem_updates_latest.txt > qmodem_updates_latest.txt 2>/dev/null || true
            git show $CONFIG_BRANCH:op_last_commit.txt > op_last_commit.txt 2>/dev/null || true
            git show $CONFIG_BRANCH:qmodem_last_commit.txt > qmodem_last_commit.txt 2>/dev/null || true
          else
            echo "⚠️ Config branch does not exist, will be created later"
          fi
          
          echo "✅ Configuration branch setup completed"
          echo "::endgroup::"

      - name: 📋 Display Build Information
        run: |
          echo "::group::🔍 Build Configuration"
          echo "📅 Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "🏷️ Build Type: $BUILD_TYPE"
          echo "🎯 Trigger: ${{ github.event_name }}"
          echo "🔧 Runner: $(uname -a)"
          echo "📂 Working Directory: $(pwd)"
          echo "🌐 Repository: ${{ github.repository }}"
          echo "📊 Workflow: ${{ github.workflow }}"
          echo "::endgroup::"

      # ============================================================================
      # System Setup Phase
      # ============================================================================
      - name: 🛠️ Setup Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "::group::🔧 System Preparation"
          
          echo "🧹 Cleaning up system packages..."
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          
          echo "📦 Updating package lists..."
          sudo -E apt-get -qq update
          
          echo "⚙️ Installing build dependencies..."
          if [ -f "$GITHUB_WORKSPACE/depends/ubuntu-22.04" ]; then
            sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu-22.04)
          else
            echo "⚠️ Dependencies file not found, using default packages"
            sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          fi
          
          echo "🐍 Setting up Python environment..."
          if ! command -v pip3 >/dev/null 2>&1; then
            wget -q https://bootstrap.pypa.io/pip/3.6/get-pip.py
            sudo python3 get-pip.py
            sudo rm -f get-pip.py
          fi
          sudo pip3 install pyelftools
          
          echo "::endgroup::"
          
          echo "::group::🧹 System Cleanup"
          
          echo "🐳 Cleaning Docker images..."
          docker rmi $(docker images -q) 2>/dev/null || true
          docker image prune -a -f 2>/dev/null || true
          
          echo "🗑️ Removing unnecessary packages..."
          sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* 2>/dev/null || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          
          echo "🕐 Setting timezone..."
          sudo timedatectl set-timezone "Asia/Shanghai"
          
          echo "📁 Creating work directory..."
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          
          echo "::endgroup::"

      - name: 📊 System Resource Check
        run: |
          echo "::group::💻 Hardware Information"
          
          echo "🔧 CPU Information:"
          echo "  Physical CPUs: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "  CPU Cores: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c)"
          echo ""
          
          echo "💾 Memory Information:"
          echo "  Installed Memory:"
          sudo lshw -short -C memory | grep GiB 2>/dev/null || echo "  Unable to detect memory details"
          echo ""
          
          echo "💿 Disk Information:"
          echo "  Available Disks: $(ls /dev/sd* 2>/dev/null | grep -v [1-9] | wc -l)"
          echo "  Disk Usage:"
          df -hT $PWD
          
          echo "::endgroup::"
          
          # Warn about resource constraints
          available_space=$(df . | tail -1 | awk '{print $4}')
          if [ "$available_space" -lt 20971520 ]; then  # Less than 20GB
            echo "⚠️ Warning: Low disk space detected! Available: $(df -h . | tail -1 | awk '{print $4}')"
            echo "::warning::Low disk space may cause build failures"
          fi

      # ============================================================================
      # Source Code Phase
      # ============================================================================
      - name: 📥 Clone Source Code
        working-directory: /mnt/workdir
        run: |
          echo "::group::📦 Source Code Acquisition"
          
          echo "💿 Available space before clone:"
          df -hT $PWD
          
          echo "🔄 Cloning OpenWrt source code..."
          echo "  Repository: $OP_URL"
          echo "  Branch: $OP_BRANCH"
          
          if git clone --depth 1 "$OP_URL" -b "$OP_BRANCH" openwrt; then
            echo "✅ Successfully cloned OpenWrt source"
          else
            echo "❌ Failed to clone OpenWrt source"
            exit 1
          fi
          
          # Create symbolic link
          ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt
          
          echo "📊 Source code statistics:"
          cd openwrt
          echo "  Commit: $(git rev-parse HEAD)"
          echo "  Author: $(git log -1 --format='%an <%ae>')"
          echo "  Date: $(git log -1 --format='%ci')"
          echo "  Message: $(git log -1 --format='%s')"
          
          echo "💿 Space after clone:"
          df -hT $PWD
          
          echo "::endgroup::"

      # ============================================================================
      # Configuration Tracking Phase
      # ============================================================================
      - name: 📋 Update Build Configuration Records
        run: |
          echo "::group::📝 Configuration Management"
          
          # 获取当前构建信息
          current_time=$(date -Iseconds)
          build_type="$BUILD_TYPE"
          
          echo "🕐 Build Time: $current_time"
          echo "🏷️ Build Type: $build_type"
          
          # 更新仓库记录函数（只保留最新记录）
          update_repo_records() {
            local repo_url="$1"
            local repo_branch="$2"
            local prefix="$3"
            local display_name="$4"
            
            echo "📦 检查 $display_name 是否有新提交..."
            
            # 克隆仓库获取最新提交
            if git clone --depth 1 "$repo_url" -b "$repo_branch" "temp_${prefix}"; then
              cd "temp_${prefix}"
              current_commit=$(git rev-parse HEAD)
              current_short=$(git rev-parse --short HEAD)
              current_author=$(git log -1 --format='%an')
              current_date=$(git log -1 --format='%ci')
              current_message=$(git log -1 --format='%s')
              cd ..
              rm -rf "temp_${prefix}"
              
              # 读取上次提交 hash
              last_commit_file="${prefix}_last_commit.txt"
              last_commit=""
              if [ -f "$last_commit_file" ]; then
                last_commit=$(cat "$last_commit_file")
              fi
              
              # 如果有新提交则更新（只保留最新记录）
              if [ "$current_commit" != "$last_commit" ]; then
                echo "✅ 检测到新提交，更新记录"
                echo "$current_commit" > "$last_commit_file"
                {
                  echo "# $display_name 最新提交记录"
                  echo "# 仓库: $repo_url"
                  echo "# 分支: $repo_branch"
                  echo "# 更新时间: $current_time"
                  echo "# 构建类型: $build_type"
                  echo ""
                  echo "提交哈希: $current_commit"
                  echo "短哈希: $current_short"
                  echo "作者: $current_author"
                  echo "日期: $current_date"
                  echo "说明: $current_message"
                } > "${prefix}_updates_latest.txt"
              else
                echo "ℹ️ 无新提交，无需更新"
              fi
            else
              echo "⚠️ 克隆 $display_name 仓库失败"
            fi
          }
          
          # 仅检测并更新 OP 仓库（只保留最新）
          update_repo_records "$OP_URL" "$OP_BRANCH" "op" "OP (coolsnowwolf/lede)"
          # 仅检测并更新 QModem 仓库（只保留最新）
          update_repo_records "$QMODEM_URL" "$QMODEM_BRANCH" "qmodem" "QModem (FUjr/QModem)"
          
          echo "::endgroup::"

      # ============================================================================
      # Build Configuration Phase
      # ============================================================================
      - name: 🔧 QModem Integration
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📱 QModem Repository Integration"
          
          echo "🔄 Cloning QModem repository..."
          if git clone "$QMODEM_URL" -b "$QMODEM_BRANCH" qmodem_temp; then
            echo "✅ Successfully cloned QModem repository"
            
            # Integrate QModem files if needed
            echo "📦 QModem commit information:"
            cd qmodem_temp
            echo "  Commit: $(git rev-parse HEAD)"
            echo "  Author: $(git log -1 --format='%an <%ae>')"
            echo "  Date: $(git log -1 --format='%ci')"
            echo "  Message: $(git log -1 --format='%s')"
            
            # Copy relevant files if they exist
            if [ -d "package" ]; then
              echo "📦 Integrating QModem packages..."
              cp -r package/* ../package/ 2>/dev/null || echo "No packages to copy"
            fi
            
            cd ..
            rm -rf qmodem_temp
          else
            echo "⚠️ Failed to clone QModem repository - continuing without it"
          fi
          
          echo "::endgroup::"

      - name: 🍽️ Configure Feeds
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::🍽️ Feed Configuration"
          
          # Load custom feeds configuration if it exists
          if [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then
            echo "📋 Loading custom feeds configuration..."
            cp "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
            echo "✅ Custom feeds configuration loaded"
          else
            echo "📋 Using default feeds configuration"
          fi
          
          # Display feeds configuration
          echo "📄 Current feeds configuration:"
          cat feeds.conf.default
          
          echo "::endgroup::"

      - name: 🎛️ Install DIY Scripts
        run: |
          echo "::group::🎛️ DIY Script Installation"
          
          # Install DIY script part 1 (before feeds update)
          if [ -f "$DIY_P1_SH" ]; then
            echo "🔧 Running DIY script part 1..."
            chmod +x "$DIY_P1_SH"
            cd /mnt/workdir/openwrt
            $GITHUB_WORKSPACE/$DIY_P1_SH
            echo "✅ DIY script part 1 completed"
          else
            echo "📝 No DIY script part 1 found"
          fi
          
          echo "::endgroup::"

      - name: 📦 Update and Install Feeds
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📦 Feed Management"
          
          echo "🔄 Updating feeds..."
          ./scripts/feeds update -a
          
          echo "⚙️ Installing feeds..."
          ./scripts/feeds install -a
          
          ./scripts/feeds install -a -f -p qmodem
          
          echo "📊 Feed statistics:"
          ./scripts/feeds list | wc -l | xargs echo "Total packages:"
          
          echo "::endgroup::"

      - name: ⚙️ Load Build Configuration
        run: |
          echo "::group::⚙️ Build Configuration"
          
          # Load custom configuration
          if [ -f "$CONFIG_FILE" ]; then
            echo "📋 Loading custom build configuration..."
            cp "$CONFIG_FILE" /mnt/workdir/openwrt/.config
            echo "✅ Custom configuration loaded"
          else
            echo "⚠️ No custom configuration found - using defaults"
            echo "CONFIG_TARGET_x86=y" > /mnt/workdir/openwrt/.config
            echo "CONFIG_TARGET_x86_64=y" >> /mnt/workdir/openwrt/.config
          fi
          
          # Run DIY script part 2 (after feeds installation)
          if [ -f "$DIY_P2_SH" ]; then
            echo "🔧 Running DIY script part 2..."
            chmod +x "$DIY_P2_SH"
            cd /mnt/workdir/openwrt
            $GITHUB_WORKSPACE/$DIY_P2_SH
            echo "✅ DIY script part 2 completed"
          else
            echo "📝 No DIY script part 2 found"
          fi
          
          echo "::endgroup::"

      # ============================================================================
      # Build Preparation Phase
      # ============================================================================
      - name: 📥 Download Packages
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📥 Package Download"
          
          echo "🔧 Generating final configuration..."
          make defconfig
          
          echo "📦 Downloading packages..."
          make download -j8
          
          # Check for download failures
          find dl -size -1024c -exec ls -l {} \; | tee download_failures.log
          if [ -s download_failures.log ]; then
            echo "⚠️ Some packages failed to download:"
            cat download_failures.log
            echo "::warning::Some packages failed to download - build may fail"
          else
            echo "✅ All packages downloaded successfully"
          fi
          
          echo "💿 Storage usage after download:"
          df -hT $PWD
          
          echo "::endgroup::"

      # ============================================================================
      # Main Build Phase
      # ============================================================================
      - name: 🏗️ Compile Firmware
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::🏗️ Firmware Compilation"
          
          build_start_time=$(date +%s)
          echo "🚀 Starting firmware compilation at $(date)"
          echo "🔧 Build Type: $BUILD_TYPE"
          
          # Determine build parameters based on type
          case "${{ github.event.inputs.build_type || 'standard' }}" in
            "debug")
              echo "🐛 Debug build - single threaded with verbose output"
              make V=s -j1
              ;;
            "minimal")
              echo "⚡ Minimal build - reduced features"
              make -j$(($(nproc)+1))
              ;;
            *)
              echo "🏭 Standard build - optimized for speed"
              make -j$(($(nproc)+1)) || make -j1 V=s
              ;;
          esac
          
          build_end_time=$(date +%s)
          build_duration=$((build_end_time - build_start_time))
          echo "⏱️ Build completed in $(($build_duration / 60)) minutes and $(($build_duration % 60)) seconds"
          
          echo "📊 Build statistics:"
          echo "  Start: $(date -d @$build_start_time)"
          echo "  End: $(date -d @$build_end_time)"
          echo "  Duration: $(($build_duration / 60))m $(($build_duration % 60))s"
          
          echo "💿 Final storage usage:"
          df -hT $PWD
          
          echo "::endgroup::"

      # ============================================================================
      # Post-Build Phase
      # ============================================================================
      - name: 📊 Build Status Check
        id: build_status
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📊 Build Result Analysis"
          
          if [ -d "bin/targets" ]; then
            echo "✅ Build successful - firmware files generated"
            
            echo "📦 Generated firmware files:"
            find bin/targets -name "*.bin" -o -name "*.img" -o -name "*.vmdk" | head -10
            
            # Count and size of generated files
            file_count=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.vmdk" \) | wc -l)
            total_size=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.vmdk" \) -exec du -c {} + | tail -1 | cut -f1)
            
            echo "📈 Build summary:"
            echo "  Generated files: $file_count"
            echo "  Total size: $(($total_size / 1024))MB"
            
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed - no firmware files generated"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "::endgroup::"

      - name: 📦 整理固件文件
        id: organize
        if: steps.build_status.outputs.status == 'success'
        run: |
          echo "::group::📦 固件整理"
          
          CURRENT_PATH=$(pwd)
          
          # 定位固件目录
          cd /mnt/workdir/openwrt/bin/targets/*/*
          TARGET_PATH=$(pwd)
          echo "📂 固件位置: ${TARGET_PATH}"
          
          # 清理 packages 目录
          rm -rf packages
          
          # 只保留 bin 文件
          mkdir -p "$ARTIFACT_DIR"
          find . -type f -name "*.bin" -exec cp {} "$ARTIFACT_DIR/" \;
          
          echo "✅ 最终固件文件:"
          ls -lh "$ARTIFACT_DIR"/*.bin 2>/dev/null || echo "未找到固件文件"
          
          # 校验文件完整性
          echo "🔍 校验文件完整性..."
          for bin_file in "$ARTIFACT_DIR"/*.bin; do
            if [ -f "$bin_file" ]; then
              echo "  ✅ $bin_file: OK"
            fi
          done
          
          echo "FIRMWARE=$ARTIFACT_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          
          echo "::endgroup::"

      # ============================================================================
      # Release Generation Phase
      # ============================================================================
      - name: 📝 生成发布说明
        id: release_note
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          echo "::group::📝 发布说明生成"
          
          RELEASE_NOTE_FILE="release_notes.md"
          
          {
            echo "# 🚀 OpenWrt 固件发布"
            echo ""
            echo "## 📋 构建信息"
            echo ""
            echo "| 属性 | 值 |"
            echo "|------|---|"
            echo "| 🏷️ 构建类型 | \`$BUILD_TYPE\` |"
            echo "| 📅 构建日期 | $(date '+%Y-%m-%d %H:%M:%S %Z') |"
            echo "| 🎯 触发方式 | ${{ github.event_name }} |"
            echo "| 🔧 运行环境 | Ubuntu 22.04 |"
            echo "| 📦 工作流程 | ${{ github.workflow }} |"
            echo ""
            echo "## 📁 固件文件"
            echo ""
            cd "$ARTIFACT_DIR"
            for bin_file in *.bin; do
              if [ -f "$bin_file" ]; then
                file_size=$(ls -lh "$bin_file" | awk '{print $5}')
                echo "- 🆕 **$bin_file** ($file_size)"
              fi
            done
            echo ""
            echo "## 📊 仓库最新提交"
            echo ""
            cd "$GITHUB_WORKSPACE"
            for prefix in op qmodem; do
              if [ -f "${prefix}_updates_latest.txt" ]; then
                while IFS= read -r line; do
                  if [[ $line == "提交哈希:"* ]]; then
                    full_hash=$(echo "$line" | cut -d' ' -f2)
                  elif [[ $line == "短哈希:"* ]]; then
                    short_hash=$(echo "$line" | cut -d' ' -f2)
                  elif [[ $line == "作者:"* ]]; then
                    author=$(echo "$line" | cut -d' ' -f2-)
                  elif [[ $line == "日期:"* ]]; then
                    timestamp=$(echo "$line" | cut -d' ' -f2-)
                  elif [[ $line == "说明:"* ]]; then
                    subject=$(echo "$line" | cut -d' ' -f2-)
                  fi
                done < "${prefix}_updates_latest.txt"
                if [ -n "$short_hash" ] && [ -n "$subject" ]; then
                  repo_url_var="${prefix^^}_URL"
                  repo_url="${!repo_url_var}"
                  echo "- [\`$short_hash\`]($repo_url/commit/$full_hash) $subject - *$author*"
                fi
                echo ""
              fi
            done
            echo "## 💾 安装说明"
            echo ""
            echo "1. **下载** 适合您设备的固件文件（.bin）"
            echo "2. **备份** 当前配置（如需要）"
            echo "3. **刷写** 使用以下方式刷入固件："
            echo "   - 网页界面升级"
            echo "   - TFTP 恢复"
            echo "   - 串口控制台"
            echo "4. **配置** 首次启动后配置设备"
            echo ""
            echo "## ⚠️ 重要提示"
            echo ""
            echo "- 这是一个 **开发版本** - 使用风险自负"
            echo "- 升级前务必备份当前固件"
            echo "- 刷机前请检查设备兼容性"
            echo "- 在主要版本之间升级时可能需要恢复出厂设置"
            echo ""
            echo "---"
            echo "*由 GitHub Actions 自动生成于 $(date '+%Y-%m-%d %H:%M:%S %Z')*"
          } > "$RELEASE_NOTE_FILE"
          
          echo "✅ 发布说明生成成功"
          echo "release_note=$RELEASE_NOTE_FILE" >> $GITHUB_OUTPUT
          
          echo "::endgroup::"

      # ============================================================================
      # Upload Phase
      # ============================================================================
      - name: 📤 上传固件文件
        if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_PREFIX }}_firmware_${{ env.BUILD_TYPE }}_$(date +%Y%m%d_%H%M%S)
          path: ${{ env.ARTIFACT_DIR }}/*.bin
          retention-days: 30
          compression-level: 0

      - name: 🎯 创建 GitHub 发布
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          echo "::group::🎯 创建 GitHub 发布"
          
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          TAG_NAME="${{ env.RELEASE_TAG }}_${TIMESTAMP}"
          RELEASE_NAME="🚀 OpenWrt 固件 - $(date +%Y-%m-%d)"
          
          echo "📋 发布信息:"
          echo "  标签: $TAG_NAME"
          echo "  名称: $RELEASE_NAME"
          echo "  预发布: ${{ env.BUILD_TYPE == 'debug' }}"
          
          if [ "${{ env.BUILD_TYPE }}" = "debug" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes-file "${{ steps.release_note.outputs.release_note }}" \
            $PRERELEASE_FLAG \
            ${{ env.ARTIFACT_DIR }}/*.bin
          
          echo "✅ 发布创建成功: $TAG_NAME"
          echo "::endgroup::"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      # ============================================================================
      # Configuration Commit Phase
      # ============================================================================
      - name: 💾 Commit Configuration Updates
        if: always() && !cancelled()
        run: |
          echo "::group::💾 Configuration Updates"
          
          # Setup git configuration
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions [Build Bot]"
          
          # Clean up conflicting files and stash changes
          echo "🧹 Cleaning up conflicting files..."
          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "💾 Stashing uncommitted changes..."
            git stash push -m "Auto-stash before config branch operations"
          fi
          
          # Remove any conflicting tracking files from working directory
          rm -f op_updates_*.txt qmodem_updates_*.txt *_last_commit.txt 2>/dev/null || true
          
          # Check out or create config branch
          if git rev-parse --verify origin/$CONFIG_BRANCH >/dev/null 2>&1; then
            git fetch origin $CONFIG_BRANCH
            git checkout $CONFIG_BRANCH
          else
            git checkout --orphan $CONFIG_BRANCH
            git rm -rf . 2>/dev/null || true
            echo "# Configuration Storage Branch" > README.md
            echo "This branch stores configuration files for the workflows." >> README.md
            git add README.md
            git commit -m "🎯 Initialize configuration storage branch"
          fi
          
          # Copy updated config files to config branch
          git checkout ${{ github.ref_name }}
          for file in op_updates_latest.txt qmodem_updates_latest.txt op_last_commit.txt qmodem_last_commit.txt; do
            if [ -f "$file" ]; then
              cp "$file" /tmp/"$file"
            fi
          done
          
          git checkout $CONFIG_BRANCH
          for file in op_updates_latest.txt qmodem_updates_latest.txt op_last_commit.txt qmodem_last_commit.txt; do
            if [ -f "/tmp/$file" ]; then
              cp "/tmp/$file" "$file"
            fi
          done
          
          # Add and commit configuration files
          git add *.txt
          
          if git diff --staged --quiet; then
            echo "📝 No configuration changes to commit"
          else
            echo "📝 Committing configuration updates..."
            
            # Create detailed commit message
            commit_msg="🏗️ Update build configuration records

            Build Information:
            - Type: $BUILD_TYPE
            - Trigger: ${{ github.event_name }}
            - Status: ${{ steps.build_status.outputs.status || 'unknown' }}
            - Date: $(date -Iseconds)
            
            Updated Files:
            $(git diff --staged --name-only | sed 's/^/- /')
            
            Auto-generated by: ${{ github.workflow }} #${{ github.run_number }}"
            
            git commit -m "$commit_msg"
            git push origin $CONFIG_BRANCH
            
            echo "✅ Configuration updates committed and pushed to config branch"
          fi
          
          echo "::endgroup::"

      # ============================================================================
      # Cleanup and Summary Phase
      # ============================================================================
      - name: 🧹 Cleanup and Maintenance
        if: always()
        run: |
          echo "::group::🧹 Cleanup Operations"
          
          # Clean up temporary directories
          echo "🗑️ Cleaning temporary files..."
          rm -rf /tmp/openwrt_* 2>/dev/null || true
          
          # Clean up old workflow runs (keep last 10)
          echo "📊 Workflow cleanup will be handled by retention settings"
          
          # Show final disk usage
          echo "💿 Final disk usage:"
          df -hT / | head -2
          
          echo "::endgroup::"

      - name: 📋 生成构建摘要
        if: always()
        run: |
          echo "# 🏗️ OpenWrt 构建摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 构建状态
          echo "## 📊 构建状态" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.build_status.outputs.status }}" = "success" ]; then
            echo "### ✅ 构建成功" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "固件已成功编译完成，可以正常使用。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 构建失败" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "构建过程中遇到错误，请检查日志了解详情。" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 构建信息
          echo "## 📋 构建详情" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 属性 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ 构建类型 | $BUILD_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 构建日期 | $(date '+%Y-%m-%d %H:%M:%S %Z') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 触发方式 | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 代码仓库 | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 工作流程 | ${{ github.workflow }} #${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 生成的文件
          if [ "${{ steps.organize.outputs.status }}" = "success" ]; then
            echo "## 📦 生成的文件" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "已生成以下固件文件：" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            cd "$ARTIFACT_DIR" 2>/dev/null || cd .
            if ls *.zip >/dev/null 2>&1; then
              for zip_file in *.zip; do
                if [ -f "$zip_file" ]; then
                  file_size=$(ls -lh "$zip_file" | awk '{print $5}')
                  echo "- 📁 \`$zip_file\` ($file_size)" >> $GITHUB_STEP_SUMMARY
                fi
              done
            else
              echo "- 📁 暂无固件文件生成" >> $GITHUB_STEP_SUMMARY
            fi
            
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 下一步操作
          echo "## 🚀 下一步操作" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$UPLOAD_RELEASE" = "true" ] && [ "${{ steps.organize.outputs.status }}" = "success" ]; then
            echo "1. 📥 **下载** 从发布页面下载固件" >> $GITHUB_STEP_SUMMARY
            echo "2. 🔍 **验证** 固件完整性" >> $GITHUB_STEP_SUMMARY
            echo "3. 📱 **刷写** 按照正确步骤刷入设备" >> $GITHUB_STEP_SUMMARY
          elif [ "$UPLOAD_FIRMWARE" = "true" ] && [ "${{ steps.organize.outputs.status }}" = "success" ]; then
            echo "1. 📥 **下载** 从工件区域下载固件" >> $GITHUB_STEP_SUMMARY
            echo "2. 🔍 **验证** 固件完整性" >> $GITHUB_STEP_SUMMARY
            echo "3. 📱 **刷写** 按照正确步骤刷入设备" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 构建完成，但未启用上传功能" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*构建完成时间：$(date '+%Y-%m-%d %H:%M:%S %Z')*" >> $GITHUB_STEP_SUMMARY