name: 🚀 OpenWrt Builder

# ================================================================================
# Trigger Configuration
# ================================================================================
on:
  repository_dispatch:
    types: [Source-Code-Update]
  workflow_dispatch:
    inputs:
      build_type:
        description: '🛠️ Build Type'
        required: false
        default: 'standard'
        type: choice
        options:
        - standard
        - debug
        - minimal
      upload_firmware:
        description: '📤 Upload Firmware'
        required: false
        default: true
        type: boolean
      upload_release:
        description: '🎯 Create Release'
        required: false
        default: true
        type: boolean

# ================================================================================
# Environment Variables
# ================================================================================
env:
  TZ: Asia/Shanghai
  ARTIFACT_DIR: /mnt/workdir/artifacts
  FIRMWARE_PREFIX: OpenWrt
  RELEASE_TAG: openwrt-release

# ================================================================================
# Jobs Configuration
# ================================================================================
jobs:
  prepare:
    runs-on: ubuntu-22.04
    name: 🛠️ Prepare Environment
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Matrix
        id: set-matrix
        run: |
          echo "matrix={\"build_type\": [\"standard\", \"debug\", \"minimal\"]}" >> $GITHUB_OUTPUT

  build_toolchain:
    needs: prepare
    runs-on: ubuntu-22.04
    name: 🔧 Build Toolchain - ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore Toolchain Cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            /mnt/workdir/openwrt/staging_dir
            /mnt/workdir/openwrt/dl
          key: toolchain-${{ matrix.build_type }}-${{ hashFiles('**/feeds.conf.default', '**/.config') }}
          restore-keys: toolchain-${{ matrix.build_type }}-

      - name: 🚀 Initialize Build Environment
        run: |
          echo "::group::🔧 Environment Setup"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          echo "::endgroup::"

      - name: 🛠️ Load Configuration & Setup Environment
        run: |
          echo "::group::🔧 Configuration Loading"
          if [ -f ".github/workflows/config.env" ]; then
            echo "📋 Loading configuration from config.env..."
            while IFS='=' read -r key value; do
              [[ $key =~ ^[[:space:]]*# ]] && continue
              [[ -z $key ]] && continue
              value=$(echo "$value" | sed 's/^"\(.*\)"$/\1/')
              [[ -z $value ]] && continue
              export "$key=$value"
              echo "$key=$value" >> $GITHUB_ENV
            done < .github/workflows/config.env
            echo "✅ Configuration loaded"
          else
            echo "❌ Configuration file not found!"
            exit 1
          fi
          echo "BUILD_TYPE=${{ matrix.build_type }}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE=${{ github.event.inputs.upload_firmware || 'true' }}" >> $GITHUB_ENV
          echo "UPLOAD_RELEASE=${{ github.event.inputs.upload_release || 'true' }}" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: 📁 Setup Configuration Branch
        run: |
          echo "::group::🔧 Configuration Branch Setup"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          rm -f op_updates.txt qmodem_updates.txt last_commit.txt 2>/dev/null || true
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash push -m "Auto-stash before config branch operations"
          fi
          if git rev-parse --verify origin/$CONFIG_BRANCH >/dev/null 2>&1; then
            git fetch origin $CONFIG_BRANCH
            git checkout $CONFIG_BRANCH
            git checkout ${{ github.ref_name }}
            git show $CONFIG_BRANCH:op_updates.txt > op_updates.txt 2>/dev/null || true
            git show $CONFIG_BRANCH:qmodem_updates.txt > qmodem_updates.txt 2>/dev/null || true
          else
            echo "⚠️ Config branch does not exist, will be created later"
          fi
          echo "✅ Configuration branch setup completed"
          echo "::endgroup::"

      - name: 📋 Display Build Information
        run: |
          echo "::group::🔍 Build Configuration"
          echo "📅 Build Time: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "🏷️ Build Type: ${{ matrix.build_type }}"
          echo "🎯 Trigger: ${{ github.event_name }}"
          echo "🔧 Runner: $(uname -a)"
          echo "📂 Working Directory: $(pwd)"
          echo "🌐 Repository: ${{ github.repository }}"
          echo "::endgroup::"

      - name: 🛠️ Setup Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo "::group::🔧 System Preparation"
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          if [ -f "$GITHUB_WORKSPACE/depends/ubuntu-22.04" ]; then
            sudo -E apt-get -qq install $(cat $GITHUB_WORKSPACE/depends/ubuntu-22.04)
          else
            sudo -E apt-get -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
          fi
          if ! command -v pip3 >/dev/null 2>&1; then
            wget -q https://bootstrap.pypa.io/pip/3.6/get-pip.py
            sudo python3 get-pip.py
            sudo rm -f get-pip.py
          fi
          sudo pip3 install pyelftools
          sudo -E apt-get -y purge azure-cli* docker* ghc* zulu* hhvm* llvm* firefox* google* dotnet* aspnetcore* powershell* openjdk* adoptopenjdk* mysql* php* mongodb* moby* snap* 2>/dev/null || true
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          echo "::endgroup::"

      - name: 📊 System Resource Check
        run: |
          echo "::group::💻 Hardware Information"
          echo "🔧 CPU: $(lscpu | grep 'Model name' | awk -F: '{print $2}' | xargs)"
          echo "💾 Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "💿 Disk Usage:"
          df -hT $PWD
          available_space=$(df . | tail -1 | awk '{print $4}')
          if [ "$available_space" -lt 20971520 ]; then
            echo "⚠️ Warning: Low disk space: $(df -h . | tail -1 | awk '{print $4}')"
            echo "::warning::Low disk space may cause build failures"
          fi
          echo "::endgroup::"

      - name: 📥 Clone Source Code
        working-directory: /mnt/workdir
        run: |
          echo "::group::📦 Source Code Acquisition"
          df -hT $PWD
          if git clone --depth 1 "$OP_URL" -b "$OP_BRANCH" openwrt; then
            echo "✅ Successfully cloned OpenWrt source"
          else
            echo "❌ Failed to clone OpenWrt source"
            exit 1
          fi
          ln -sf /mnt/workdir/openwrt $GITHUB_WORKSPACE/openwrt
          cd openwrt
          echo "📊 Source: Commit $(git rev-parse --short HEAD) by $(git log -1 --format='%an')"
          echo "::endgroup::"

      - name: 📋 Update Build Configuration Records
        run: |
          echo "::group::📝 Configuration Management"
          current_time=$(date -Iseconds)
          update_repo_records() {
            local repo_url="$1" repo_branch="$2" prefix="$3" display_name="$4"
            echo "📦 Checking $display_name for updates..."
            if git clone --depth 1 "$repo_url" -b "$repo_branch" "temp_${prefix}"; then
              cd "temp_${prefix}"
              current_commit=$(git rev-parse HEAD)
              current_short=$(git rev-parse --short HEAD)
              current_author=$(git log -1 --format='%an')
              current_date=$(git log -1 --format='%ci')
              current_message=$(git log -1 --format='%s')
              cd ..
              rm -rf "temp_${prefix}"
              last_commit=""
              if [ -f "${prefix}_last_commit.txt" ]; then
                last_commit=$(cat "${prefix}_last_commit.txt")
              fi
              if [ "$current_commit" != "$last_commit" ]; then
                echo "✅ New commit detected, updating records"
                echo "$current_commit" > "${prefix}_last_commit.txt"
                {
                  echo "# $display_name Latest Commit"
                  echo "- Repository: $repo_url"
                  echo "- Branch: $repo_branch"
                  echo "- Build Time: $current_time"
                  echo "- Commit: $current_short"
                  echo "- Author: $current_author"
                  echo "- Date: $current_date"
                  echo "- Message: $current_message"
                } > "${prefix}_updates.txt"
              else
                echo "ℹ️ No new commits"
              fi
            else
              echo "⚠️ Failed to clone $display_name"
            fi
          }
          update_repo_records "$OP_URL" "$OP_BRANCH" "op" "OpenWrt"
          update_repo_records "$QMODEM_URL" "$QMODEM_BRANCH" "qmodem" "QModem"
          echo "::endgroup::"

      - name: 🔧 QModem Integration
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📱 QModem Integration"
          if git clone "$QMODEM_URL" -b "$QMODEM_BRANCH" qmodem_temp; then
            echo "✅ Cloned QModem repository"
            cd qmodem_temp
            echo "📦 QModem Commit: $(git rev-parse --short HEAD)"
            if [ -d "package" ]; then
              cp -r package/* ../package/ 2>/dev/null || echo "No packages to copy"
            fi
            cd ..
            rm -rf qmodem_temp
          else
            echo "⚠️ Failed to clone QModem repository"
          fi
          echo "::endgroup::"

      - name: 🍽️ Configure Feeds
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::🍽️ Feed Configuration"
          if [ -f "$GITHUB_WORKSPACE/$FEEDS_CONF" ]; then
            cp "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
            echo "✅ Custom feeds loaded"
          else
            echo "📋 Using default feeds"
          fi
          echo "📄 Feeds:"
          cat feeds.conf.default
          echo "::endgroup::"

      - name: 🎛️ Install DIY Scripts
        run: |
          echo "::group::🎛️ DIY Script Installation"
          if [ -f "$DIY_P1_SH" ]; then
            chmod +x "$DIY_P1_SH"
            cd /mnt/workdir/openwrt
            $GITHUB_WORKSPACE/$DIY_P1_SH
            echo "✅ DIY script part 1 completed"
          else
            echo "📝 No DIY script part 1 found"
          fi
          echo "::endgroup::"

      - name: 📦 Update and Install Feeds
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📦 Feed Management"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install -a -f -p qmodem
          echo "📊 Total packages: $(./scripts/feeds list | wc -l)"
          echo "::endgroup::"

      - name: ⚙️ Load Build Configuration
        run: |
          echo "::group::⚙️ Build Configuration"
          if [ -f "$CONFIG_FILE" ]; then
            cp "$CONFIG_FILE" /mnt/workdir/openwrt/.config
            echo "✅ Custom configuration loaded"
          else
            echo "⚠️ Using default configuration"
            echo "CONFIG_TARGET_x86=y" > /mnt/workdir/openwrt/.config
            echo "CONFIG_TARGET_x86_64=y" >> /mnt/workdir/openwrt/.config
          fi
          if [ -f "$DIY_P2_SH" ]; then
            chmod +x "$DIY_P2_SH"
            cd /mnt/workdir/openwrt
            $GITHUB_WORKSPACE/$DIY_P2_SH
            echo "✅ DIY script part 2 completed"
          else
            echo "📝 No DIY script part 2 found"
          fi
          echo "::endgroup::"

      - name: 📥 Download Packages
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📥 Package Download"
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \; | tee download_failures.log
          if [ -s download_failures.log ]; then
            echo "⚠️ Some packages failed to download:"
            cat download_failures.log
            echo "::warning::Some packages failed to download"
          else
            echo "✅ All packages downloaded"
          fi
          echo "💿 Storage usage:"
          df -hT $PWD
          echo "::endgroup::"

      - name: 🏗️ Compile Toolchain
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::🏗️ Toolchain Compilation"
          make tools/compile -j$(nproc)
          make toolchain/compile -j$(nproc)
          echo "✅ Toolchain compiled"
          echo "::endgroup::"

      - name: Save Toolchain Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /mnt/workdir/openwrt/staging_dir
            /mnt/workdir/openwrt/dl
          key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

  build_firmware:
    needs: [prepare, build_toolchain]
    runs-on: ubuntu-22.04
    name: 🏗️ Build Firmware - ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: Restore Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            /mnt/workdir/openwrt/staging_dir
            /mnt/workdir/openwrt/dl
          key: toolchain-${{ matrix.build_type }}-${{ hashFiles('**/feeds.conf.default', '**/.config') }}
          restore-keys: toolchain-${{ matrix.build_type }}-

      - name: 🚀 Initialize Build Environment
        run: |
          echo "::group::🔧 Environment Setup"
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /mnt/workdir
          sudo chown $USER:$GROUPS /mnt/workdir
          echo "::endgroup::"

      - name: 🛠️ Load Configuration & Setup Environment
        run: |
          echo "::group::🔧 Configuration Loading"
          if [ -f ".github/workflows/config.env" ]; then
            echo "📋 Loading configuration from config.env..."
            while IFS='=' read -r key value; do
              [[ $key =~ ^[[:space:]]*# ]] && continue
              [[ -z $key ]] && continue
              value=$(echo "$value" | sed 's/^"\(.*\)"$/\1/')
              [[ -z $value ]] && continue
              export "$key=$value"
              echo "$key=$value" >> $GITHUB_ENV
            done < .github/workflows/config.env
            echo "✅ Configuration loaded"
          else
            echo "❌ Configuration file not found!"
            exit 1
          fi
          echo "BUILD_TYPE=${{ matrix.build_type }}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE=${{ github.event.inputs.upload_firmware || 'true' }}" >> $GITHUB_ENV
          echo "UPLOAD_RELEASE=${{ github.event.inputs.upload_release || 'true' }}" >> $GITHUB_ENV
          echo "::endgroup::"

      - name: 🏗️ Compile Firmware
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::🏗️ Firmware Compilation"
          build_start_time=$(date +%s)
          case "${{ matrix.build_type }}" in
            "debug")
              echo "🐛 Debug build"
              make V=s -j1
              ;;
            "minimal")
              echo "⚡ Minimal build"
              make -j$(nproc)
              ;;
            *)
              echo "🏭 Standard build"
              make -j$(nproc) || make -j1 V=s
              ;;
          esac
          build_end_time=$(date +%s)
          build_duration=$((build_end_time - build_start_time))
          echo "⏱️ Build completed in $(($build_duration / 60))m $(($build_duration % 60))s"
          echo "::endgroup::"

      - name: 📊 Build Status Check
        id: build_status
        working-directory: /mnt/workdir/openwrt
        run: |
          echo "::group::📊 Build Result Analysis"
          if [ -d "bin/targets" ]; then
            echo "✅ Build successful"
            file_count=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.vmdk" \) | wc -l)
            total_size=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.vmdk" \) -exec du -c {} + | tail -1 | cut -f1)
            echo "📈 Files: $file_count, Total size: $(($total_size / 1024))MB"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Build failed"
            echo "status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "::endgroup::"

      - name: 📦 Organize Firmware Files
        id: organize
        if: steps.build_status.outputs.status == 'success'
        run: |
          echo "::group::📦 Firmware Organization"
          cd /mnt/workdir/openwrt/bin/targets/*/*
          TARGET_PATH=$(pwd)
          rm -rf packages
          mkdir -p "$ARTIFACT_DIR"
          find . -type f -name "*.bin" -exec cp {} "$ARTIFACT_DIR/" \;
          echo "✅ Firmware files:"
          ls -lh "$ARTIFACT_DIR"/*.bin 2>/dev/null || echo "No firmware files"
          for bin_file in "$ARTIFACT_DIR"/*.bin; do
            if [ -f "$bin_file" ]; then
              echo "✅ $bin_file: OK"
            fi
          done
          echo "FIRMWARE=$ARTIFACT_DIR" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: 📝 Generate Release Notes
        id: release_note
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          echo "::group::📝 Release Notes Generation"
          RELEASE_NOTE_FILE="release_notes.md"
          {
            echo "# 🚀 OpenWrt Firmware Release 🎉"
            echo ""
            echo "## 📊 Build Overview"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| 🏷️ Type | ${{ matrix.build_type }} |"
            echo "| 📅 Date | $(date '+%Y-%m-%d %H:%M:%S %Z') |"
            echo "| 🎯 Trigger | ${{ github.event_name }} |"
            echo "| 🔧 Environment | Ubuntu 22.04 |"
            echo ""
            echo "## 🆕 Latest Updates"
            for prefix in op qmodem; do
              if [ -f "${prefix}_updates.txt" ]; then
                echo "- **$(grep '^#.*Latest Commit' ${prefix}_updates.txt | cut -d' ' -f2-)**"
                grep '^-' ${prefix}_updates.txt | sed 's/^- /  * /'
                echo ""
              fi
            done
            echo "## 📁 Firmware Files"
            cd "$ARTIFACT_DIR"
            for bin_file in *.bin; do
              if [ -f "$bin_file" ]; then
                file_size=$(ls -lh "$bin_file" | awk '{print $5}')
                echo "- 🆕 **$bin_file** ($file_size)"
              fi
            done
            echo ""
            echo "## 💾 Installation Instructions"
            echo "1. **Download** the appropriate firmware file (.bin)"
            echo "2. **Backup** your current configuration"
            echo "3. **Flash** using:"
            echo "   - Web interface upgrade"
            echo "   - TFTP recovery"
            echo "   - Serial console"
            echo "4. **Configure** device after first boot"
            echo ""
            echo "## ⚠️ Important Notes"
            echo "- This is a **development version** - use at your own risk"
            echo "- Always backup before upgrading"
            echo "- Verify device compatibility"
            echo "- Factory reset may be required for major version upgrades"
            echo ""
            echo "---"
            echo "*Generated by GitHub Actions on $(date '+%Y-%m-%d %H:%M:%S %Z')*"
          } > "$RELEASE_NOTE_FILE"
          echo "✅ Release notes generated"
          echo "release_note=$RELEASE_NOTE_FILE" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: 📤 Upload Firmware Files
        if: env.UPLOAD_FIRMWARE == 'true' && steps.organize.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FIRMWARE_PREFIX }}_firmware_${{ matrix.build_type }}_$(date +%Y%m%d_%H%M%S)
          path: ${{ env.ARTIFACT_DIR }}/*.bin
          retention-days: 30
          compression-level: 0

      - name: 🎯 Create GitHub Release
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
        run: |
          echo "::group::🎯 GitHub Release Creation"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          TAG_NAME="${{ env.RELEASE_TAG }}_${TIMESTAMP}_${{ matrix.build_type }}"
          RELEASE_NAME="🚀 OpenWrt Firmware - $(date +%Y-%m-%d)"
          if [ "${{ matrix.build_type }}" = "debug" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          gh release create "$TAG_NAME" \
            --title "$RELEASE_NAME" \
            --notes-file "${{ steps.release_note.outputs.release_note }}" \
            $PRERELEASE_FLAG \
            ${{ env.ARTIFACT_DIR }}/*.bin
          echo "✅ Release created: $TAG_NAME"
          echo "::endgroup::"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN || secrets.GITHUB_TOKEN }}

      - name: 💾 Commit Configuration Updates
        if: always() && !cancelled()
        run: |
          echo "::group::💾 Configuration Updates"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions [Build Bot]"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git stash push -m "Auto-stash before config branch operations"
          fi
          rm -f op_updates.txt qmodem_updates.txt last_commit.txt 2>/dev/null || true
          if git rev-parse --verify origin/$CONFIG_BRANCH >/dev/null 2>&1; then
            git fetch origin $CONFIG_BRANCH
            git checkout $CONFIG_BRANCH
          else
            git checkout --orphan $CONFIG_BRANCH
            git rm -rf . 2>/dev/null || true
            echo "# Configuration Storage Branch" > README.md
            git add README.md
            git commit -m "🎯 Initialize configuration storage branch"
          fi
          git checkout ${{ github.ref_name }}
          for file in op_updates.txt qmodem_updates.txt last_commit.txt; do
            if [ -f "$file" ]; then
              cp "$file" /tmp/"$file"
            fi
          done
          git checkout $CONFIG_BRANCH
          for file in op_updates.txt qmodem_updates.txt last_commit.txt; do
            if [ -f "/tmp/$file" ]; then
              cp "/tmp/$file" "$file"
            fi
          done
          git add *.txt
          if git diff --staged --quiet; then
            echo "📝 No configuration changes to commit"
          else
            commit_msg="🏗️ Update configuration records\n\n- Type: ${{ matrix.build_type }}\n- Trigger: ${{ github.event_name }}\n- Status: ${{ steps.build_status.outputs.status || 'unknown' }}\n- Date: $(date -Iseconds)"
            git commit -m "$commit_msg"
            git push origin $CONFIG_BRANCH
            echo "✅ Configuration updates committed"
          fi
          echo "::endgroup::"

      - name: 🧹 Cleanup and Maintenance
        if: always()
        run: |
          echo "::group::🧹 Cleanup Operations"
          rm -rf /tmp/openwrt_* 2>/dev/null || true
          echo "💿 Final disk usage:"
          df -hT /
          echo "::endgroup::"

      - name: 📋 Generate Build Summary
        if: always()
        run: |
          echo "# 🏗️ OpenWrt Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Build Status" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build_status.outputs.status }}" = "success" ]; then
            echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
            echo "Firmware compiled successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "Check logs for details." >> $GITHUB_STEP_SUMMARY
          fi
          echo "## 📋 Build Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Type | ${{ matrix.build_type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📅 Date | $(date '+%Y-%m-%d %H:%M:%S %Z') |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔧 Repository | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "$UPLOAD_RELEASE" = "true" ] && [ "${{ steps.organize.outputs.status }}" = "success" ]; then
            echo "- 📥 **Download** from release page" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 **Verify** firmware integrity" >> $GITHUB_STEP_SUMMARY
            echo "- 📱 **Flash** to device" >> $GITHUB_STEP_SUMMARY
          elif [ "$UPLOAD_FIRMWARE" = "true" ] && [ "${{ steps.organize.outputs.status }}" = "success" ]; then
            echo "- 📥 **Download** from artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- 🔍 **Verify** firmware integrity" >> $GITHUB_STEP_SUMMARY
            echo "- 📱 **Flash** to device" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Build completed, no upload enabled" >> $GITHUB_STEP_SUMMARY
          fi
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Completed: $(date '+%Y-%m-%d %H:%M:%S %Z')*" >> $GITHUB_STEP_SUMMARY
