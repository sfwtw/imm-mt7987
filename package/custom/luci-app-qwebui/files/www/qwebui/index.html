        <div class="row align-items-center mt-5 gap-md-3 gap-2">
          <div class="col align-self-center">

              模块温度</div>
            </div>
          </div>

          <div class="col align-self-center">
            <div class="card">

                        <td x-text="mccmnc"></td>
                      </tr>

                        <td x-text="apn"></td>

                      </tr>

                        <td x-text="bandwidth"></td>
                      </tr>

                        <th scope="row">频点</th>
                        <td x-text="earfcns"></td>
                      </tr>
                      <tr>
                        <th scope="row">PCI</th>
                        <td

                        <td x-show="sccPCI == '-'" x-text="pccPCI"></td>

                        <td x-text="ipv4"></td>
                      </tr>
                      <tr>
                        <th scope="row">IPv<sup>6</sup></th>
                        <td x-text="ipv6"></td>
                      </tr>
                      <tr>
                        <th scope="row">在线时长</th>
                        <td x-text="uptime"></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <div class="card-footer">
                <div class="row row-cols-2">
                  <div class="col">
                    <p class="btn">刷新率(>3s)</p>

                        type="button"

                        设置

                  </div>

          <div class="col">

                      <tr>
                        <th scope="row">小区ID</th>
                        <td x-text="cellID"></td>
                      </tr>
                      <tr>
                        <th scope="row">eNB ID</th>

                      <tr>

                        <th scope="row">RSSI<sup>4G</sup></th>
                        <td x-show="rssi != '-'" x-text="rssi"></td>
                        <td x-show="rssi == '-'" class="fst-italic">None</td>
                      </tr> -->
                      <tr x-show="rsrqLTE != '-'">
                        <th scope="row">SS_RSRQ<sup>4G</sup></th>
                        <td
                          class="gap-4 align-items-center"
                          x-data="{ getProgressBarClass: function() {
                          // Remove the percentage sign and convert to integer
                          var percentage = parseInt(this.rsrqLTEPercentage);
                          
                          if (percentage >= 60) {
                              return 'progress-bar bg-success is-medium';
                          } else if (percentage >= 40) {
                              return 'progress-bar bg-warning is-warning is-medium';
                          } else {
                              return 'progress-bar bg-danger is-medium';
                          }
                      } }"
                        >
                          <div
                            x-show="rsrqLTE != '-' && rsrqLTEPercentage != '0'"
                            class="progress w-100"
                            role="progressbar"
                            aria-label="RSRQ BAR"
                            :aria-valuenow="rsrqLTEPercentage"
                            aria-valuemin="0"
                            aria-valuemax="100"
                            style="height: 18px"
                          >
                            <div
                              :class="getProgressBarClass()"
                              :style="'width: ' + rsrqLTEPercentage + '%'"
                            >
                              <span
                                x-text="rsrqLTE + ' / ' +  rsrqLTEPercentage + '%'"
                              ></span>
                            </div>
                          </div>
                          <span
                            x-show="rsrqLTEPercentage == '0'"
                            x-text="rsrqLTE"
                          ></span>
                          <span x-show="rsrqLTE == '-'" class="fst-italic">
                            None
                          </span>
                        </td>
                      </tr>

                              return 'progress-bar bg-warning is-warning is-medium';

                              return 'progress-bar bg-danger is-medium';
                          }

                      </tr>

                          getProgressBarClass: function() {
                              // Remove the percentage sign and convert to integer
                              var percentage = parseInt(this.rsrpLTEPercentage);
                              
                              if (percentage >= 60) {
                                  return 'progress-bar bg-success is-medium';

                                  return 'progress-bar bg-warning is-warning is-medium';

                          getProgressBarClass: function() {
                              // Remove the percentage sign and convert to integer
                              var percentage = parseInt(this.sinrLTEPercentage);
                              
                              if (percentage >= 60) {
                                  return 'progress-bar bg-success is-medium';
                              } else if (percentage >= 40) {
                                  return 'progress-bar bg-warning is-warning is-medium';
                              } else {
                                  return 'progress-bar bg-danger is-medium';

    <script>
      function processAllInfos() {
        return {
          atcmd: "",
          internetConnectionStatus: "已断开",
          temperature: "0",
          simStatus: "无SIM卡",
          activeSim: "无SIM卡",
          networkProvider: "N/A",
          mccmnc: "00000",
          apn: "未知",
          networkMode: "已断开",

          bandwidth: "未知",

          pccPCI: "0",

          ipv4: "000.000.000.000",
          ipv6: "0000:0000:0000:0000:0000:0000:0000:0000",
          cellID: "未知",
          eNBID: "未知",
          tac: "未知",
          csq: "-",
          // rssi: "-",
          rsrpLTE: "-",
          rsrpNR: "-",
          rsrpLTEPercentage: "0%",
          rsrpNRPercentage: "0%",
          rsrqLTE: "-",
          rsrqNR: "-",
          rsrqLTEPercentage: "0%",
          rsrqNRPercentage: "0%",
          sinrLTE: "-",
          sinrNR: "-",
          sinrLTEPercentage: "0%",
          sinrNRPercentage: "0%",
          signalPercentage: "0",
          signalAssessment: "未知",
          uptime: "Unknown",
          lastUpdate: new Date().toLocaleString(),
          newRefreshRate: null,
          refreshRate: 6,
          nrDownload: "0",
          nrUpload: "0",
          nonNrDownload: "0",
          nonNrUpload: "0",
          downloadStat: "0",
          uploadStat: "0",
          mccmncNumber: "未知",
          ambr: "未知",
          qci: "未知",
          cfgList: [],
          selectedCfg: null,
          intervalId: null,
          init() {
            this.updateCfgList();
          },
          updateCfgList() {
            fetch('/cgi-bin/luci/admin/modem/qmodem/get_modem_cfg')
              .then(response => response.json())
              .then(data => {
                this.cfgList = data.cfgs.map(cfg => ({ value: cfg.cfg, name: cfg.name }));
                if (this.cfgList.length > 0 && !this.selectedCfg) {
                  this.selectedCfg = this.cfgList[0].value;
                }
                this.fetchAllInfo();
                this.intervalId = setInterval(() => {
                  this.fetchAllInfo();
                }, this.refreshRate * 1000);
              })
              .catch(error => console.error('Error fetching cfg list:', error));
          },
          changeCfg() {
            this.fetchAllInfo();
            clearInterval(this.intervalId);
            this.intervalId = setInterval(() => {
              this.fetchAllInfo();
            }, this.refreshRate * 1000);
          },
          fetchAllInfo() {
            if (!this.selectedCfg) return;
            fetch('/cgi-bin/luci/admin/modem/qmodem/modem_ctrl?' + new URLSearchParams({
              cfg: this.selectedCfg,
              action: 'info',
              translate: '1'
            }))
              .then(response => response.json())
              .then(data => {
                this.parseData(data);
                this.lastUpdate = new Date().toLocaleString();
              })
              .catch(error => console.error('Error fetching modem info:', error));
          },

          bytesToSize(bytes) {
            const sizes = ["Bytes", "KB", "MB", "GB", "TB"];
            if (bytes == 0) return "0 Byte";
            const i = parseInt(Math.floor(Math.log(bytes) / Math.log(1024)));
            return Math.round(bytes / Math.pow(1024, i), 2) + " " + sizes[i];
          },

          requestPing() {
            fetch('/cgi-bin/luci/admin/modem/qwebui/qwebui_ctrl?' + new URLSearchParams({
              cfg: this.selectedCfg,
              action: 'get_ping',
              translate: '1'
            }))
              .then((response) => response.json())
                .then((data) => {
                if (data && data.result) {
                  return data.result;
                }
                return "Error";
                })
              .catch((error) => {
                console.error("Error:", error);
                // Throw the error again to ensure it's propagated
                throw error;
              });
          },

          calculate_lte_bw(lte_bw) {
            switch (true) {
              case 0:
                return 1.4;
              case 1:
                return 3;
              // Now case 2 - 5
              case lte_bw >= 2 && lte_bw <= 5:
                return (lte_bw - 1) * 5;
              default:
                return "未知";
            }
          },

          calculate_nr_bw(nr_bw) {
            switch (true) {
              case nr_bw >= 0 && nr_bw <= 5:
                return (nr_bw + 1) * 5;
              case nr_bw >= 6 && nr_bw <= 12:
                return (nr_bw - 2) * 10;
              case nr_bw === 13:
                return "200";
              case nr_bw === 14:
                return "400";
              default:
                return "未知";
            }
          },

          calculateRSRPPercentage(rsrp) {
            let RSRP_min = -135;
            let RSRP_max = -65;

            // If rsrp is null, return 0%
            if (isNaN(rsrp) || rsrp < -140) {
              return 0;
            }

            let percentage = ((rsrp - RSRP_min) / (RSRP_max - RSRP_min)) * 100;

            if (percentage > 100) {
              percentage = 100;
            }

            // if percentage is less than 15%, make it 15%
            if (percentage < 15) {
              percentage = 15;
            }

            return Math.round(percentage);
          },

          calculateRSRQPercentage(rsrq) {
            let RSRQ_min = -20;
            let RSRQ_max = -8;

            // If rsrq is null, return 0%
            if (isNaN(rsrq) || rsrq < -20) {
              return 0;
            }

            let percentage = ((rsrq - RSRQ_min) / (RSRQ_max - RSRQ_min)) * 100;

            if (percentage > 100) {
              percentage = 100;
            }

            // if percentage is less than 15%, make it 15%
            if (percentage < 15) {
              percentage = 15;
            }

            return Math.round(percentage);
          },

          calculateSINRPercentage(sinr) {
            let SINR_min = -10; // Changed from 0
            let SINR_max = 35;

            // If sinr is null, return 0%
            if (isNaN(sinr) || sinr < -10) {
              return 0;
            }

            let percentage = ((sinr - SINR_min) / (SINR_max - SINR_min)) * 100;

            if (percentage > 100) {
              percentage = 100;
            }

            // if percentage is less than 15%, make it 15%
            if (percentage < 15) {
              percentage = 15;
            }

            return Math.round(percentage);
          },

          // Calculate the overall signal assessment
          calculateSignalPercentage(rsrpNRPercentage, sinrNRPercentage) {
            // Get the average of the RSRP Percentage and SINR Percentage
            let average = (rsrpNRPercentage + sinrNRPercentage) / 2;
            return Math.round(average);
          },

          signalQuality(percentage) {
            if (percentage >= 80) {
              return "优秀";
            } else if (percentage >= 60) {
              return "良好";
            } else if (percentage >= 40) {
              return "一般";
            } else if (percentage >= 0) {
              return "差";
            } else {
              return "无信号";
            }
          },

          fetchUpTime() {
            // Content-Type: text/plain
            //
            // 1 hour 44, minute
            fetch('/cgi-bin/luci/admin/modem/qwebui/qwebui_ctrl?' + new URLSearchParams({
              cfg: this.selectedCfg,
              action: 'get_uptime',
              translate: '1'
            }))
              .then((response) => response.json())
              .then((data) => {
                // Example result
                // 01:17:02 up 3 days,  2:41,  load average: 0.65, 0.66, 0.60

                // Look for xx days in the result
                const days = data.result.match(/(\d+) day/);
                // Do the same for hours
                const hours = data.result.match(/(\d+) hour/);
                // Do the same for minutes
                const minutes = data.result.match(/(\d+) min/);
                // 2:41
                const hoursAndMinutes = data.result.match(/(\d+):(\d+),/);

                if (hoursAndMinutes != null) {
                  if (days != null) {
                    if (days[1] === "1") {
                      if (hoursAndMinutes[1] === "1") {
                        this.uptime =
                          days[1] +
                          " day, " +
                          hoursAndMinutes[1] +
                          " hour " +
                          hoursAndMinutes[2] +
                          " minutes";
                      } else if (hoursAndMinutes[2] === 1) {
                        this.uptime =
                          days[1] +
                          " day, " +
                          hoursAndMinutes[1] +
                          " hours " +
                          hoursAndMinutes[2] +
                          " minute";
                      } else {
                        this.uptime =
                          days[1] +
                          " day, " +
                          hoursAndMinutes[1] +
                          " hours " +
                          hoursAndMinutes[2] +
                          " minutes";
                      }
                    } else {
                      if (hoursAndMinutes[1] === "1") {
                        this.uptime =
                          days[1] +
                          " days, " +
                          hoursAndMinutes[1] +
                          " hour " +
                          hoursAndMinutes[2] +
                          " minutes";
                      } else if (hoursAndMinutes[2] === 1) {
                        this.uptime =
                          days[1] +
                          " days, " +
                          hoursAndMinutes[1] +
                          " hours " +
                          hoursAndMinutes[2] +
                          " minute";
                      } else {
                        this.uptime =
                          days[1] +
                          " days, " +
                          hoursAndMinutes[1] +
                          " hours " +
                          hoursAndMinutes[2] +
                          " minutes";
                      }
                    }
                  } else {
                    if (hoursAndMinutes[1] === "1") {
                      this.uptime =
                        hoursAndMinutes[1] +
                        " hour " +
                        hoursAndMinutes[2] +
                        " minutes";
                    } else if (hoursAndMinutes[2] === 1) {
                      this.uptime =
                        hoursAndMinutes[1] +
                        " hours " +
                        hoursAndMinutes[2] +
                        " minute";
                    } else {
                      this.uptime =
                        hoursAndMinutes[1] +
                        " hours " +
                        hoursAndMinutes[2] +
                        " minutes";
                    }
                  }
                } else if (days != null) {
                  if (hours != null) {
                    if (days[1] === "1") {
                      if (hours[1] === "1") {
                        this.uptime = days[1] + " day, " + hours[1] + " hour";
                      } else {
                        this.uptime = days[1] + " day, " + hours[1] + " hours";
                      }
                    } else {
                      if (hours[1] === "1") {
                        this.uptime = days[1] + " days, " + hours[1] + " hour";
                      } else {
                        this.uptime = days[1] + " days, " + hours[1] + " hours";
                      }
                    }
                  } else if (minutes != null) {
                    if (days[1] === "1") {
                      if (minutes[1] === "1") {
                        this.uptime =
                          days[1] + " day, " + minutes[1] + " minute";
                      } else {
                        this.uptime =
                          days[1] + " day, " + minutes[1] + " minutes";
                      }
                    } else {
                      if (minutes[1] === "1") {
                        this.uptime =
                          days[1] + " days, " + minutes[1] + " minute";
                      } else {
                        this.uptime =
                          days[1] + " days, " + minutes[1] + " minutes";
                      }
                    }
                  } else {
                    if (days[1] === "1") {
                      this.uptime = days[1] + " day";
                    } else {
                      this.uptime = days[1] + " days";
                    }
                  }
                } else if (hours != null) {
                  if (hours[1] === "1") {
                    this.uptime = hours[1] + " hour";
                  } else {
                    this.uptime = hours[1] + " hours";
                  }
                } else if (minutes != null) {
                  if (minutes[1] === "1") {
                    this.uptime = minutes[1] + " minute";
                  } else {
                    this.uptime = minutes[1] + " minutes";
                  }
                } else {
                  this.uptime = "未知时间";
                }
              });
          },
          parseData(data) {
            // Reset or set defaults if needed
            for (let entry of data) {
              if (entry.key === 'temperature') {
                this.temperature = entry.value.replace('°C', '');
              } else if (entry.key === 'SIM Status') {
                this.simStatus = entry.value === 'ready' ? '已激活' : '无SIM卡';
              } else if (entry.key === 'SIM Slot') {
                this.activeSim = 'SIM ' + entry.value;
              } else if (entry.key === 'MMC') {
                this.mccmnc = entry.value;
              } else if (entry.key === 'MNC') {
                this.mccmnc += entry.value;
                
                const mccmncMap = {
                        "46000":"中国移动",
                         "46001":"中国联通",  "46003":"中国电信",  "46009":"中国联通",
                           "46011":"中国电信", "46015":"中国广电", "46020":"中国铁通"};
                const mccmncNumber = Number(this.mccmnc);
                this.networkProvider = mccmncMap[mccmncNumber] || "未知运营商";
              } else if (entry.key === 'network_mode') {
                this.networkMode = entry.value;
              } else if (entry.key === 'Band') {
                this.bands = entry.value;
              } else if (entry.key === 'DL Bandwidth') {
                this.bandwidth = entry.value;
              } else if (entry.key === 'UL Bandwidth') {
                this.bandwidth += ' / ' + entry.value;
              } else if (entry.key === 'ARFCN') {
                this.earfcns = entry.value;
              } else if (entry.key === 'Physical Cell ID') {
                this.pccPCI = entry.value;
              } else if (entry.key === 'Cell ID') {
                this.cellID = entry.value;
              } else if (entry.key === 'TAC') {
                this.tac = entry.value;
              } else if (entry.key === 'RSRP') {
                this.rsrpNR = entry.value;
                this.rsrpNRPercentage = this.calculateRSRPPercentage(
                  parseInt(this.rsrpNR)
                );
              } else if (entry.key === 'RSRQ') {
                this.rsrqNR = entry.value;
                this.rsrqNRPercentage = this.calculateRSRQPercentage(
                  parseInt(this.rsrqNR)
                );
              } else if (entry.key === 'SINR') {
                this.sinrNR = entry.value;
                this.sinrNRPercentage = this.calculateSINRPercentage(
                  parseInt(this.sinrNR)
                );
              }
            }
            // Set signalAssessment based on signalPercentage
            this.signalPercentage = this.calculateSignalPercentage(parseInt(this.rsrpNRPercentage), parseInt(this.sinrNRPercentage));
            let perc = parseInt(this.signalPercentage);
            if (perc >= 80) {
              this.signalAssessment = '优秀';
            } else if (perc >= 60) {
              this.signalAssessment = '良好';
            } else if (perc >= 40) {
              this.signalAssessment = '一般';
            } else {
              this.signalAssessment = '差';
            }
          },
          calculatePercentage(value, min, max) {
            if (isNaN(value) || isNaN(min) || isNaN(max)) return 0;
            let percentage = ((value - min) / (max - min)) * 100;
            return Math.max(0, Math.min(100, Math.round(percentage)));
          },
          updateRefreshRate() {
            if (this.newRefreshRate >= 3 && this.newRefreshRate <= 60) {
              this.refreshRate = this.newRefreshRate;
              this.newRefreshRate = null;
              clearInterval(this.intervalId);
              this.intervalId = setInterval(() => {
                this.fetchAllInfo();
              }, this.refreshRate * 1000);
            }
          },
        };
      }
    </script>
  </body>
</html>
